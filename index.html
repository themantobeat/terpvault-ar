<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerpVault AR</title>
<script type="module" src="model-viewer.min.js"></script>
<style>
  :root { --bg:#0b0b0b; --mint:#7cdcd2; --cream:#f3eee3; --muted:#a9a59c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--cream); font-family:system-ui, sans-serif; }
  body { display:flex; flex-direction:column; min-height:100dvh; }
  header { padding:18px 16px 6px; text-align:center; }
  h1 { color:var(--mint); margin:0; font-size:clamp(24px,6vw,36px); letter-spacing:.02em; }
  header p { margin:6px 0 0; color:var(--muted); font-size:15px; }
  model-viewer { flex:1; width:100%; min-height:62dvh; --poster-color:transparent; }
  .ar-btn { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); font:500 16px system-ui, sans-serif; background:var(--mint); color:#0b0b0b; border:0; border-radius:999px; padding:13px 22px; cursor:pointer; white-space:nowrap; }
  .hint { text-align:center; color:var(--muted); font-size:13px; padding:10px 16px 18px; }
  .ar-fallback { display:none; margin:0 auto 14px; text-align:center; color:var(--cream); font-size:15px; }
  .ar-fallback img { width:132px; height:132px; border-radius:10px; display:block; margin:8px auto 0; }
  .ar-fallback a { color:var(--mint); }
  .err { color:#f08080; text-align:center; padding:8px 16px; font-size:14px; }
</style>
</head>
<body>
  <header>
    <h1>SEE INSIDE THE VAULT</h1>
    <p>Spin it, zoom in, or place it on your table.</p>
  </header>
  <model-viewer id="mv" alt="TerpVault Pre-Roll and Bud Vault display"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
    camera-controls touch-action="pan-y" 
    camera-orbit="-22deg 76deg 0.40m" camera-target="0m 0.095m 0m" min-camera-orbit="auto auto 0.1m" shadow-intensity="0.9" exposure="1.7" tone-mapping="neutral" environment-image="studio_env.jpg?v=5" shadow-softness="0.6"
    interaction-prompt="auto">
    <button slot="ar-button" class="ar-btn">View in your space</button>
  </model-viewer>
  <div id="arfb" class="ar-fallback">
    <div id="arfb-text"></div>
    <img id="arfb-qr" src="ar-qr.png" alt="QR code to open the AR viewer on your phone" hidden>
  </div>
  <p id="err" class="err"></p>
  <p class="hint">Shown at real size in AR. Works in Chrome on Android and Safari on iPhone.</p>
<script>
  const mv = document.getElementById('mv');
  mv.src = 'terp_vault_display.glb?v=5';
  mv.setAttribute('ios-src', 'terp_vault_display.usdz?v=5');
  mv.addEventListener('error', () => { document.getElementById('err').textContent = 'Could not load the model.'; });

  // AR needs a phone. Show a clear fallback when this browser cannot start AR (desktop, or inside an embed).
  const inFrame = window.top !== window.self;
  if (inFrame) { document.documentElement.style.background = "transparent"; document.body.style.background = "transparent"; }
  const fullUrl = 'https://themantobeat.github.io/terpvault-ar/?utm_source=embed&utm_medium=ar_link&utm_campaign=ar_cross_section';
  function showFallback() {
    const box = document.getElementById('arfb'), txt = document.getElementById('arfb-text');
    const touch = matchMedia('(pointer:coarse)').matches;
    // phones: the built-in AR button works on the full page; inside an embed also offer a link that opens the full page, in case AR is blocked in the frame
    if (mv.canActivateAR && !(touch && inFrame)) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    if (touch) {
      txt.innerHTML = inFrame ? '<a href="' + fullUrl + '" target="_blank" rel="noopener">Tap to open full page and view in AR on your table</a>' : 'AR is not available in this browser. Try Chrome (Android) or Safari (iPhone).';
    } else {
      txt.textContent = 'To see it on your table, scan this with your phone:';
      document.getElementById('arfb-qr').hidden = false;
    }
  }
  mv.addEventListener('load', () => setTimeout(showFallback, 300));
</script>
</body>
</html>
