<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerpVault AR</title>
<script type="module" src="model-viewer.min.js"></script>
<style>
  :root { --bg:#0b0b0b; --mint:#7cdcd2; --cream:#f3eee3; --muted:#a9a59c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--cream); font-family:system-ui, sans-serif; }
  body { position:relative; min-height:100dvh; overflow:hidden; }
  header { position:absolute; z-index:2; left:max(20px, calc((100% - 980px) / 2)); top:0; max-width:min(52%, 520px); padding:26px 0 0; text-align:left; pointer-events:none; }
  h1 { color:var(--mint); margin:0; font-size:clamp(28px,4.6vw,56px); line-height:1.02; letter-spacing:.02em; text-wrap:balance; }
  header p { margin:10px 0 0; color:#c9c4b8; font-size:clamp(15px,1.6vw,19px); line-height:1.35; }
  model-viewer { position:absolute; inset:0; width:100%; height:100%; --poster-color:transparent; }
  @media (max-width:700px) { .ar-btn { font-size:14px !important; padding:11px 18px !important; } }
  model-viewer.in-frame .ar-btn { display:none; }
  /* scroll-through strips: the model never captures the wheel or a swipe here, so the page keeps scrolling */
  .gutter { position:absolute; z-index:4; top:0; bottom:0; width:clamp(28px, 9vw, 120px); touch-action:pan-y; }
  .gutter.l { left:0; } .gutter.r { right:0; }
  .hs { width:1px; height:1px; pointer-events:none; }
  /* floor reflection: the viewer's own picture, flipped under the plinth and faded out */
  #refl { position:absolute; left:0; right:0; top:0; height:0; overflow:hidden; z-index:1; pointer-events:none; opacity:0; transition:opacity .35s;
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,0) 85%); mask-image:linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,0) 85%); }
  #refl.on { opacity:.55; }
  #refl img { position:absolute; left:0; top:0; width:100%; transform-origin:0 0; filter:blur(1.5px) brightness(.8); }
  .ar-btn { position:absolute; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); font:500 16px system-ui, sans-serif; background:var(--mint); color:#0b0b0b; border:0; border-radius:999px; padding:13px 22px; cursor:pointer; white-space:nowrap; }
  .hint { position:absolute; z-index:2; left:max(20px, calc((100% - 980px) / 2)); bottom:14px; margin:0; max-width:46%; color:var(--muted); font-size:12px; pointer-events:none; }
  /* desktop: a small 'View in your room' card in the corner, so the model gets the whole page */
  .ar-fallback { display:none; position:absolute; z-index:3; right:max(16px, calc((100% - 980px) / 2)); bottom:20px; width:236px; padding:12px; border-radius:14px; background:rgba(22,22,22,.86); border:1px solid rgba(243,238,227,.14); backdrop-filter:blur(8px); color:var(--cream); font-size:13px; line-height:1.3; }
  .ar-fallback .row { display:flex; gap:12px; align-items:center; }
  .ar-fallback .row[hidden] { display:none; }
  @media (max-width:700px) { .hint { display:none; } header { max-width:calc(100% - 40px); left:20px; padding-top:18px; } h1 { font-size:clamp(26px,8vw,40px); } }
  .ar-fallback img { width:84px; height:84px; flex:none; border-radius:8px; background:#fff; padding:4px; display:block; }
  .ar-fallback b { display:block; font-size:14px; margin-bottom:3px; color:var(--cream); }
  .ar-fallback span { color:var(--muted); }
  .ar-fallback.link { background:none; border:0; backdrop-filter:none; padding:0; }
  .ar-fallback .arbtn { display:inline-block; font:500 15px system-ui,sans-serif; background:var(--mint); color:#0b0b0b; text-decoration:none; border-radius:999px; padding:12px 20px; white-space:nowrap; }
  .ar-fallback.link { left:50%; right:auto; transform:translateX(-50%); width:auto; max-width:calc(100% - 32px); text-align:center; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); }
  .ar-fallback a { color:var(--mint); }
  .err { color:#f08080; text-align:center; padding:8px 16px; font-size:14px; }
</style>
</head>
<body>
  <header>
    <h1>SEE INSIDE THE VAULT</h1>
    <p>Spin it, zoom in, or place it on your table.</p>
  </header>
  <div class="gutter l" aria-hidden="true"></div><div class="gutter r" aria-hidden="true"></div>
  <div id="refl" aria-hidden="true"><img id="reflimg" alt=""></div>
  <model-viewer id="mv" alt="TerpVault Pre-Roll and Bud Vault display"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
    camera-controls touch-action="pan-y" max-camera-orbit="auto auto 1.4m" 
    camera-orbit="-22deg 76deg 0.38m" camera-target="0m 0.1m 0m" min-camera-orbit="auto auto 0.08m" shadow-intensity="1.6" exposure="1.7" tone-mapping="neutral" environment-image="studio_env.jpg?v=26" shadow-softness="0.85"
    interaction-prompt="auto">
    <button slot="ar-button" class="ar-btn">View in your space</button>
    <div slot="hotspot-floor" class="hs" data-position="0m 0m 0m" data-normal="0m 1m 0m"></div>
  </model-viewer>
  <div id="arfb" class="ar-fallback">
    <div id="arfb-text"></div>
    <div class="row" id="arfb-row" hidden>
      <img id="arfb-qr" src="ar-qr.png" alt="QR code to open the AR viewer on your phone">
      <div><b>View in your room</b><span>Scan with your phone camera to see it at real size.</span></div>
    </div>
  </div>
  <p id="err" class="err"></p>
  <p class="hint">Drag to spin, scroll to zoom. AR works in Chrome on Android and Safari on iPhone.</p>
<script>
  const mv = document.getElementById('mv');
  mv.src = 'terp_vault_display.glb?v=26';
  mv.setAttribute('ios-src', 'terp_vault_display.usdz?v=26');
  // small screens: pull back and sit the model lower so the title never covers a lid
  // wide, short frames (like the Wix section) start closer so the vaults fill the frame
  if (innerWidth >= 700) {
    const asp = innerWidth / innerHeight, r = asp >= 2.2 ? 0.33 : asp >= 1.7 ? 0.36 : 0.38;
    mv.setAttribute('camera-orbit', '-22deg 76deg ' + r + 'm'); mv.setAttribute('camera-target', '0m 0.1m 0m');
  }
  if (innerWidth < 700) { mv.setAttribute('camera-orbit', '-22deg 76deg 0.70m'); mv.setAttribute('camera-target', '0m 0.105m 0m'); }
  mv.addEventListener('error', () => { document.getElementById('err').textContent = 'Could not load the model.'; });

  // AR needs a phone. Show a clear fallback when this browser cannot start AR (desktop, or inside an embed).
  const inFrame = window.top !== window.self;
  if (inFrame) { document.documentElement.style.background = "transparent"; document.body.style.background = "transparent"; }
  const fullUrl = 'https://themantobeat.github.io/terpvault-ar/?utm_source=embed&utm_medium=ar_link&utm_campaign=ar_cross_section';
  function showFallback() {
    const box = document.getElementById('arfb'), txt = document.getElementById('arfb-text');
    const phone = matchMedia('(pointer:coarse)').matches || innerWidth < 700;   // phone-sized or touch: the device itself is the AR device
    if (phone) {
      // one button only: on the full page the built-in "View in your space" button starts AR
      if (!inFrame) {
        if (mv.canActivateAR) { box.style.display = 'none'; return; }
        box.style.display = 'block'; box.classList.add('link');
        txt.textContent = 'AR needs Chrome on Android or Safari on iPhone.';
        return;
      }
      // inside the Wix embed: this button replaces the built-in one and starts AR right here; only if the phone refuses AR in a frame does it open the full page
      mv.classList.add('in-frame');
      box.style.display = 'block'; box.classList.add('link');
      txt.innerHTML = '<a class="arbtn" id="argo" href="' + fullUrl + '" target="_blank" rel="noopener">View in your space</a>';
      document.getElementById('argo').addEventListener('click', (e) => {
        if (mv.canActivateAR) { e.preventDefault(); mv.activateAR(); }
      });
      return;
    }
    // computer: a QR code that opens this page on a phone
    box.style.display = 'block';
    document.getElementById('arfb-row').hidden = false;
  }
  mv.addEventListener('load', () => setTimeout(showFallback, 300));

  // floor reflection: snapshot the model after the camera settles, then draw it flipped below the plinth's front edge
  const refl = document.getElementById('refl'), reflimg = document.getElementById('reflimg'), hs = mv.querySelector('.hs');
  let rt = 0, busy = false, lastUrl = null;
  async function updateRefl() {
    if (busy || !mv.loaded) return; busy = true;
    try {
      const blob = await mv.toBlob({ mimeType: 'image/png' });
      const url = URL.createObjectURL(blob);
      await new Promise((res) => { reflimg.onload = res; reflimg.src = url; });
      if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = url;
      const box = mv.getBoundingClientRect(), fy = hs.getBoundingClientRect().top - box.top;
      const h = reflimg.clientWidth ? reflimg.naturalHeight * (reflimg.clientWidth / reflimg.naturalWidth) : box.height;
      if (fy > 0 && fy < box.height) {
        refl.style.top = fy + 'px'; refl.style.height = Math.max(0, Math.min(box.height - fy, h * 0.4)) + 'px';
        reflimg.style.transform = 'translateY(' + fy + 'px) scaleY(-1)';
        refl.classList.add('on');
      }
    } catch (e) { /* reflection is optional */ }
    busy = false;
  }
  function scheduleRefl() { refl.classList.remove('on'); clearTimeout(rt); rt = setTimeout(updateRefl, 300); }
  mv.addEventListener('camera-change', (e) => { if (e.detail && e.detail.source === 'user-interaction') scheduleRefl(); });
  mv.addEventListener('load', () => setTimeout(updateRefl, 900));
  addEventListener('resize', scheduleRefl);
</script>
</body>
</html>
